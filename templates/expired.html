<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Expired — Snip</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0a0a0f;
      color: #f0f0f5;
      font-family: 'Syne', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .logo-container {
      margin-bottom: 24px;
    }
    .error-icon {
      font-size: 5rem;
      color: #ff5566;
      margin-bottom: 10px;
      line-height: 1;
    }
    h1 { font-size: 4rem; color: #ff5566; margin-bottom: 0; font-weight: 800; letter-spacing: -1px; }
    p { font-family: 'DM Mono', monospace; color: #6b6b80; margin-top: 16px; font-size: 1rem; max-width: 500px; line-height: 1.5; }
    .code-badge {
      display: inline-block;
      background: #1a0a0d;
      border: 1px solid #3d1217;
      color: #ff5566;
      font-family: 'DM Mono', monospace;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.95rem;
      margin-top: 12px;
    }
    a { color: #f0f0f5; border: 1px solid #22222e; border-radius: 8px; text-decoration: none; font-family: 'DM Mono', monospace; font-size: 0.9rem; padding: 10px 20px; margin-top: 32px; display: inline-block; transition: background 0.2s, border-color 0.2s; }
    a:hover { background: #13131a; border-color: #ff5566; color: #ff5566; }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="error-icon">⌛</div>
    <h1>Link Expired</h1>
  </div>
  <p>This short link has reached its expiration date and is no longer active.</p>
  <div class="code-badge">code: /{{ code }}</div>
  <a href="/">← Go to Snip</a>
</body>
</html>
